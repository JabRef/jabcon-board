<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>JabCon board</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header id="header">
  <h1 id="title">JabCon</h1>
  <div id="clock">--:--</div>
  <div id="progress">
    <div id="phases"></div>
    <div id="bar"><div id="elapsed"></div><div id="ticks"></div></div>
    <div id="dates"><span id="from"></span><span id="countdown"></span><span id="to"></span></div>
  </div>
  <div id="updated" title=""></div>
  <img id="logo" src="https://www.jabref.org/img/JabRef-icon-256.png" alt="">
</header>
<main>
  <section class="column" id="backlog"><h2>Backlog <span class="count"></span></h2><div class="more above"></div><div class="cards"></div><div class="more below"></div></section>
  <section class="column" id="progress"><h2>In progress <span class="count"></span></h2><div class="more above"></div><div class="cards"></div><div class="more below"></div></section>
  <section class="column" id="done"><h2>Done <span class="count"></span></h2><div class="more above"></div><div class="cards"></div><div class="more below"></div></section>
  <section id="stats">
    <h2>Stats</h2>
    <div id="totals"></div>
    <div id="statsrow"><div id="components"></div><div id="milestones"></div><div><h3>Nerd corner</h3><ul id="refactorings"></ul></div></div>
    <div id="leaderboard"></div>
  </section>
  <section id="activity">
    <h2>Latest activity</h2>
    <ul id="ticker"></ul>
    <video id="gource" autoplay muted loop playsinline></video>
  <div id="gource-missing">gource video not rendered yet<br><a href="https://files.jabref.org/gource/jabcon-2026.mp4">files.jabref.org/gource/jabcon-2026.mp4</a></div>
  </section>
</main>
<div id="footer"><span id="data-time"></span><span id="version"></span></div>
<div id="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
<script src="app.js"></script>
</body>
</html>
