<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>JabCon board</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header id="header">
  <h1 id="title">JabCon</h1>
  <div id="clock">--:--</div>
  <div id="timeline">
    <div id="phases"></div>
    <div id="bar"><div id="elapsed"></div><div id="ticks"></div></div>
    <div id="dates"><span id="from"></span><span id="countdown"></span><span id="to"></span></div>
  </div>
  <div id="updated" title=""></div>
  <img id="logo" src="https://www.jabref.org/img/JabRef-icon-256.png" alt="">
</header>
<!-- [impl->req~heading-tooltips~1] -->
<main>
  <section class="column" id="backlog"><h2 title="What is waiting to be picked up: open items with the JabCon focus label, open PRs marked ready-for-review, and anything open assigned to a participant.&#10;Why: this is where you look for your next task.">Backlog <span class="count"></span></h2><div class="more above"></div><div class="cards"></div><div class="more below"></div></section>
  <section class="column" id="progress"><h2 title="What is being worked on right now: open PRs authored or reviewed by a participant and touched since JabCon started.&#10;Why: it shows who is busy with what, and which PRs are waiting for a review.">In progress <span class="count"></span></h2><div class="more above"></div><div class="cards"></div><div class="more below"></div></section>
  <section class="column" id="done"><h2 title="What landed during JabCon: PRs merged or closed and issues closed since the start (earlier work does not count).&#10;Why: the visible result of the event — every card here is a finished piece of work.">Done <span class="count"></span></h2><div class="more above"></div><div class="cards"></div><div class="more below"></div></section>
  <section id="stats">
    <h2 title="Aggregated numbers over the merged PRs: files touched and lines added/removed, the most-changed components, milestone progress, notable refactorings, and the contributor leaderboard.&#10;Why: the columns show single items, this shows the sum.">Stats <span id="totals"></span></h2>
    <div id="statsrow"><div><h3>Components</h3><div id="components"></div></div><div><h3>Milestones</h3><div id="milestones"></div></div><div id="nerd"><h3>Nerd corner</h3><ul id="refactorings"></ul><div id="aimodels" hidden><h4>AI models</h4><div class="chart"></div></div></div></div>
    <div id="leaderboard"></div>
  </section>
  <section id="activity">
    <h2 title="The newest GitHub events of the participants — pushes, comments, reviews, opened and closed items — with the points they scored.&#10;Why: the live pulse of JabCon; the gource video below replays the same history as a visualisation.">Latest activity</h2>
    <ul id="ticker"></ul>
    <video id="gource" autoplay muted loop playsinline></video>
  <div id="gource-missing">gource video not rendered yet<br><a href="https://files.jabref.org/gource/jabcon-2026.mp4">files.jabref.org/gource/jabcon-2026.mp4</a></div>
  </section>
</main>
<div id="footer"><span id="data-time"></span><span id="version"></span></div>
<div id="detail" hidden><div class="bar"><button class="back">← Back</button><h2></h2></div><ul></ul></div>
<div id="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
<script src="app.js"></script>
</body>
</html>
