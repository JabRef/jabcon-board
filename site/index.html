<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>JabCon board</title>
<meta name="description" content="Live JabCon board: what participants are working on, what landed, and who did what.">
<link rel="canonical" href="https://jabref.github.io/jabcon-board/">
<meta name="theme-color" content="#0d1117">

<!-- Open Graph is consumed by Facebook, LinkedIn, Slack, Discord, WhatsApp, Telegram, and other share clients. -->

<meta property="og:type" content="website">

<meta property="og:title" content="JabCon board">
<meta property="og:description" content="Live JabCon board: what participants are working on, what landed, and who did what.">
<meta property="og:url" content="https://jabref.github.io/jabcon-board/">
<meta property="og:image" content="https://jabref.github.io/jabcon-board/og-board.png?v=2026-09-12T18-37-09Z">
<meta property="og:image:secure_url" content="https://jabref.github.io/jabcon-board/og-board.png?v=2026-09-12T18-37-09Z">

<!-- Twitter/X uses these directly and falls back to the Open Graph values elsewhere. -->
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="JabCon board">
<meta name="twitter:description" content="Live JabCon board: what participants are working on, what landed, and who did what.">
<meta name="twitter:image" content="https://jabref.github.io/jabcon-board/og-board.png?v=2026-09-12T18-37-09Z">
<meta name="twitter:image:alt" content="JabCon board showing the live activity wall">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header id="header">
  <h1 id="title">JabCon</h1>
  <div id="clock">--:--</div>
  <div id="timeline">
    <div id="phases"></div>
    <div id="bar"><div id="elapsed"></div><div id="ticks"></div></div>
    <div id="heat" title="Activity per hour over JabCon: the brighter, the more events (all participants). The night gaps are the working-hours pattern."></div>
    <div id="dates"><span id="from"></span><span id="countdown"></span><span id="to"></span></div>
  </div>
  <div id="updated" title=""></div>
  <img id="logo" src="jabref-icon-256.png" alt="">
</header>
<!-- [impl->req~heading-tooltips~1] -->
<main>
  <section class="column" id="backlog"><h2 title="What is waiting to be picked up: open items with the JabCon focus label or in one of the JabCon milestones.&#10;Why: this is where you look for your next task.">Backlog <span class="count"></span></h2><div class="more above"></div><div class="cards"></div><div class="more below"></div></section>
  <section class="column" id="progress"><h2 title="What is being worked on right now: open PRs authored or reviewed by a participant and touched since JabCon started.&#10;Why: it shows who is busy with what, and which PRs are waiting for a review.">In progress <span class="count"></span></h2><div class="more above"></div><div class="cards"></div><div class="more below"></div></section>
  <section class="column" id="done"><h2 title="What landed during JabCon: PRs merged or closed and issues closed since the start (earlier work does not count).&#10;Why: the visible result of the event — every card here is a finished piece of work.">Done <span class="count"></span></h2><div class="more above"></div><div class="cards"></div><div class="more below"></div></section>
  <section id="stats">
    <h2 title="Aggregated numbers over the merged PRs: files touched and lines added/removed, the most-changed components, milestone progress, notable refactorings, and the contributor leaderboard.&#10;Why: the columns show single items, this shows the sum.">Stats <span id="totals"></span><span id="prgoal" hidden></span></h2>
    <div id="statsrow"><div><h3>Components</h3><div id="components"></div></div><div><h3>Milestones</h3><div id="milestones"></div></div><div id="nerd"><h3>Nerd corner</h3><ul id="refactorings"></ul><div id="aimodels" hidden><h4>AI models</h4><div class="chart"></div></div></div></div>
    <div id="leaderboard"></div>
  </section>
  <section id="activity">
    <h2 title="The newest GitHub events of the participants — pushes, comments, reviews, opened and closed items — with the points they scored. Events on JabCon items (focus label or milestone) come first and score tenfold; everything else follows below the divider.&#10;Why: the live pulse of JabCon; the gource video below replays the same history as a visualisation.">Latest activity</h2>
    <ul id="ticker"></ul>
    <video id="gource" autoplay muted playsinline></video>
    <button id="prev-video" class="video-nav" title="Skip to the previous video">◀</button>
    <button id="next-video" class="video-nav" title="Skip to the next video">▶</button>
  <div id="gource-missing">gource video not rendered yet<br><a href="https://files.jabref.org/gource/jabcon-2026.mp4">files.jabref.org/gource/jabcon-2026.mp4</a></div>
  </section>
</main>
<div id="footer"><div id="news"><span></span></div><span id="stamp"><a id="privacy" href="privacy.html">what this board collects</a><span id="data-time"></span><span id="version"></span></span></div>
<div id="detail" hidden><div class="bar"><button class="back">← Back</button><h2></h2></div><ul></ul></div>
<div id="toast"></div>
<!-- [impl->req~no-third-party-requests~1] vendored, not from a CDN: nobody but this origin learns that
     somebody is looking at the board. Update by re-downloading the same file from npm. -->
<script src="confetti.browser.min.js"></script>
<script src="app.js"></script>
</body>
</html>
