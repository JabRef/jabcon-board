# Publishes site/ and a fresh data.json to gh-pages every 5 minutes. The collector exits early outside the JabCon window
# (config.json) unless "force" is set on a manual run.
name: Board

on:
  push:
    branches: [main]
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      force:
        description: Collect data even outside the JabCon window
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: gh-pages

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: scripts/gh-pages.sh prepare
      - name: Copy site
        run: cp -r site/. out/ && echo "${GITHUB_SHA::7}" > out/version.txt
      - name: Collect data
        env:
          GITHUB_TOKEN: ${{ github.token }}
          # optional fine-grained PAT for milestones in private repos
          MILESTONE_TOKEN: ${{ secrets.BOARD_TOKEN }}
        run: python3 scripts/collect.py --out out/data.json ${{ inputs.force && '--force' || '' }}
      - run: scripts/gh-pages.sh push
