# Archives a screenshot of the live board every three hours during the day (for the blog post / a time-lapse after
# JabCon). Nothing is taken between 22:00 and 06:00 local time: a screenshot kept forever is a permanent record of who
# was working at three in the morning, and the board does not keep that. [impl->req~no-behaviour-profiling~1]
name: Screenshot

on:
  schedule:
    - cron: '30 6,9,12,15,18 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  screenshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Skip outside the JabCon window
        id: window
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json; from datetime import datetime, timezone
          c = json.load(open("config.json")); now = datetime.now(timezone.utc)
          print("active=" + str(datetime.fromisoformat(c["jabcon_start"]) <= now <= datetime.fromisoformat(c["jabcon_end"])).lower())
          PY
      - name: Take screenshot
        if: steps.window.outputs.active == 'true'
        run: |
          mkdir -p screenshots
          snapshot="screenshots/$(date -u +%Y-%m-%dT%H-%M-%SZ).png"
          google-chrome --headless=new --no-sandbox --hide-scrollbars --window-size=1920,1080 --virtual-time-budget=10000 \
            --screenshot="$snapshot" "https://jabref.github.io/jabcon-board/"
          cp "$snapshot" site/og-board.png # [impl->req~social-sharing-metadata~4]
          version="${snapshot##*/}"
          version="${version%.png}"
          python3 - "$version" <<'PY'
          from pathlib import Path
          import re, sys
          path = Path("site/index.html")
          html = path.read_text()
          path.write_text(re.sub(r"og-board\.png(?:\?v=[^\"']*)?", f"og-board.png?v={sys.argv[1]}", html))
          PY
      - name: Commit
        if: steps.window.outputs.active == 'true'
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add screenshots site/og-board.png site/index.html
          git commit -q -m "Add screenshot $(date -u +%FT%TZ)"
          git pull --rebase -q origin main && git push origin HEAD:main
